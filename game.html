<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1">
<title>SPACE RAIDERS</title>
<style>
  :root {
    --c0: #000008;
    --c1: #0ff;
    --c2: #f0f;
    --c3: #ff0;
    --c4: #0f8;
    --glow1: 0 0 8px #0ff, 0 0 20px #0ff4;
    --glow2: 0 0 8px #f0f, 0 0 20px #f0f4;
    --glow3: 0 0 8px #ff0, 0 0 20px #ff04;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    background: var(--c0);
    color: #fff;
    font-family: 'Courier New', monospace;
    overflow: hidden;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ── SCREENS ── */
  .screen { display:none; width:100%; height:100dvh; flex-direction:column; align-items:center; justify-content:center; padding:20px; }
  .screen.active { display:flex; }

  /* LOBBY */
  #screen-lobby {
    background: radial-gradient(ellipse at 50% 30%, #001a2e 0%, #000008 70%);
    gap: 24px;
  }
  .logo {
    font-size: clamp(2rem, 10vw, 3.5rem);
    font-weight: 900;
    letter-spacing: 0.15em;
    color: var(--c1);
    text-shadow: var(--glow1);
    animation: pulse 2s ease-in-out infinite;
    text-align: center;
  }
  .logo span { color: var(--c2); text-shadow: var(--glow2); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.75} }

  .subtitle {
    font-size: clamp(0.6rem, 3vw, 0.85rem);
    letter-spacing: 0.3em;
    color: #666;
    text-align: center;
    text-transform: uppercase;
  }

  .input-group { display:flex; flex-direction:column; gap:8px; width:100%; max-width:320px; }
  .input-group label { font-size:0.7rem; letter-spacing:0.2em; color:var(--c1); text-transform:uppercase; }
  .input-group .hint { font-size:0.6rem; color:#444; letter-spacing:.05em; text-transform:none; margin-top:-4px; }
  input[type="text"] {
    background: #0a0a1a;
    border: 1px solid var(--c1);
    border-radius: 4px;
    color: #fff;
    font-family: inherit;
    font-size: 1rem;
    padding: 12px 16px;
    outline: none;
    width: 100%;
    box-shadow: inset 0 0 10px #0ff1;
    transition: border-color .2s, box-shadow .2s;
  }
  input[type="text"]:focus { border-color: var(--c2); box-shadow: inset 0 0 10px #f0f1, 0 0 0 2px #f0f3; }

  .btn {
    background: transparent;
    border: 2px solid var(--c1);
    border-radius: 4px;
    color: var(--c1);
    cursor: pointer;
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: 700;
    letter-spacing: 0.2em;
    padding: 14px 24px;
    text-transform: uppercase;
    transition: all .15s;
    width: 100%;
    max-width: 320px;
    text-shadow: var(--glow1);
    box-shadow: 0 0 10px #0ff2;
  }
  .btn:active { background: #0ff2; transform: scale(.97); }
  .btn:disabled { opacity: .3; cursor: not-allowed; }
  .btn.danger { border-color: var(--c2); color: var(--c2); text-shadow: var(--glow2); box-shadow: 0 0 10px #f0f2; }

  .status-box {
    background: #0a0a1a;
    border: 1px solid #1a1a3a;
    border-radius: 6px;
    padding: 16px;
    width: 100%;
    max-width: 320px;
    font-size: 0.75rem;
    line-height: 1.8;
  }
  .status-box .row { display:flex; justify-content:space-between; }
  .status-box .val { color: var(--c4); }
  .status-box .val.warn { color: var(--c3); }
  .status-box .val.ok { color: var(--c4); }
  .status-box .val.err { color: var(--c2); }

  .players-list { display:flex; flex-direction:column; gap:6px; width:100%; max-width:320px; }
  .player-slot {
    background: #0a0a1a;
    border: 1px solid #1a1a3a;
    border-radius: 4px;
    padding: 10px 14px;
    font-size: 0.75rem;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .player-slot .dot { width:8px; height:8px; border-radius:50%; background:#222; }
  .player-slot.p1 .dot { background:var(--c1); box-shadow:var(--glow1); }
  .player-slot.p2 .dot { background:var(--c2); box-shadow:var(--glow2); }
  .player-slot.p3 .dot { background:var(--c3); box-shadow:var(--glow3); }
  .player-slot .name { flex:1; }
  .player-slot .tag { color:#555; font-size:0.65rem; letter-spacing:.1em; }
  .player-slot.filled .name { color:#fff; }
  .player-slot.filled .tag { color:var(--c4); }

  /* GAME */
  #screen-game {
    padding: 0;
    justify-content: flex-start;
    position: relative;
  }
  #hud {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 10px;
    background: #00000a;
    border-bottom: 1px solid #0ff2;
    flex-shrink: 0;
    z-index: 10;
  }
  .hud-score { font-size: 0.7rem; letter-spacing:.1em; }
  .hud-score span { font-size: 1rem; font-weight:700; }
  .hud-lives { display:flex; gap:3px; }
  .hud-wave { font-size: 0.7rem; color: #888; letter-spacing:.15em; }

  #canvas {
    display: block;
    width: 100%;
    flex: 1;
    touch-action: none;
  }

  /* CONTROLS */
  #controls {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 16px;
    background: #00000a;
    border-top: 1px solid #0ff2;
    flex-shrink: 0;
    gap: 10px;
    height: 80px;
  }
  .ctrl-btn {
    background: #0a0a18;
    border: 2px solid #1a1a40;
    border-radius: 8px;
    color: #fff;
    font-size: 1.4rem;
    width: 64px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    transition: background .1s, border-color .1s;
    flex-shrink: 0;
  }
  .ctrl-btn:active, .ctrl-btn.pressed {
    background: #0ff2;
    border-color: var(--c1);
  }
  #btn-fire {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    font-size: 1.6rem;
    border-color: var(--c2);
    color: var(--c2);
    margin: 0 auto;
  }
  #btn-fire:active, #btn-fire.pressed { background: #f0f2; }
  .ctrl-dpad { display:flex; gap:8px; }

  /* OVERLAY */
  #overlay {
    display: none;
    position: fixed; inset:0;
    background: #000a;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 20px;
    z-index: 100;
    padding: 30px;
  }
  #overlay.active { display:flex; }
  #overlay h2 { font-size: clamp(1.5rem, 8vw, 2.5rem); text-align:center; letter-spacing:.1em; }
  #overlay .big-score { font-size: clamp(2rem, 12vw, 4rem); font-weight:900; color:var(--c1); text-shadow:var(--glow1); }
  #overlay p { text-align:center; font-size:0.85rem; color:#888; line-height:1.6; white-space:pre-line; }

  /* Stars background */
  #starfield { position:fixed; inset:0; pointer-events:none; z-index:0; }
  .screen { position:relative; z-index:1; }
</style>
</head>
<body>

<canvas id="starfield"></canvas>

<!-- LOBBY -->
<div id="screen-lobby" class="screen active">
  <div class="logo">SPACE<br><span>RAIDERS</span></div>
  <div class="subtitle">Multijugador Online · 3 Jugadores</div>

  <div class="input-group">
    <label>Servidor</label>
    <span class="hint">IP local (192.168.x.x:3000) o dominio Railway/Render</span>
    <input type="text" id="input-server" placeholder="tu-app.up.railway.app" autocomplete="off" spellcheck="false">
  </div>

  <div class="input-group">
    <label>Tu nombre</label>
    <input type="text" id="input-name" placeholder="Piloto" maxlength="12" autocomplete="off">
  </div>

  <button class="btn" id="btn-connect">CONECTAR</button>

  <div class="status-box" id="status-box">
    <div class="row"><span>Estado</span><span class="val" id="st-conn">Desconectado</span></div>
    <div class="row"><span>Jugadores</span><span class="val" id="st-players">0 / 3</span></div>
    <div class="row"><span>Tu rol</span><span class="val" id="st-role">—</span></div>
    <div class="row"><span>P2P</span><span class="val" id="st-p2p">—</span></div>
  </div>

  <div class="players-list" id="players-list">
    <div class="player-slot p1" id="slot-1"><div class="dot"></div><span class="name">Esperando...</span><span class="tag">J1</span></div>
    <div class="player-slot p2" id="slot-2"><div class="dot"></div><span class="name">Esperando...</span><span class="tag">J2</span></div>
    <div class="player-slot p3" id="slot-3"><div class="dot"></div><span class="name">Esperando...</span><span class="tag">J3</span></div>
  </div>
</div>

<!-- GAME -->
<div id="screen-game" class="screen">
  <div id="hud">
    <div class="hud-score" id="hud-scores">P1: <span id="sc1">0</span></div>
    <div class="hud-wave" id="hud-wave">OLEADA 1</div>
    <div class="hud-lives" id="hud-lives"></div>
  </div>
  <canvas id="canvas"></canvas>
  <div id="controls">
    <div class="ctrl-dpad">
      <div class="ctrl-btn" id="btn-left">◀</div>
      <div class="ctrl-btn" id="btn-right">▶</div>
    </div>
    <div class="ctrl-btn" id="btn-fire" style="font-size:1.4rem">⚡</div>
    <div style="width:136px"></div>
  </div>
</div>

<!-- OVERLAY -->
<div id="overlay">
  <h2 id="overlay-title">GAME OVER</h2>
  <div class="big-score" id="overlay-score">0</div>
  <p id="overlay-msg"></p>
  <button class="btn" id="btn-restart">VOLVER AL LOBBY</button>
</div>

<script>
// ═══════════════════════════════════════════════════════
//  SPACE RAIDERS — Motor P2P con soporte online (WSS)
// ═══════════════════════════════════════════════════════

// ── STARFIELD ──
;(function(){
  const c = document.getElementById('starfield');
  const ctx = c.getContext('2d');
  let stars = [];
  function resize(){ c.width=window.innerWidth; c.height=window.innerHeight; }
  function init(){ stars=[]; for(let i=0;i<120;i++) stars.push({x:Math.random()*c.width, y:Math.random()*c.height, r:Math.random()*1.5, s:Math.random()*0.4+0.1}); }
  function draw(){ ctx.clearRect(0,0,c.width,c.height); ctx.fillStyle='#fff'; stars.forEach(s=>{s.y+=s.s; if(s.y>c.height){s.y=0;s.x=Math.random()*c.width;} ctx.globalAlpha=0.4+Math.random()*0.2; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();}); ctx.globalAlpha=1; requestAnimationFrame(draw); }
  window.addEventListener('resize',()=>{resize();init();});
  resize(); init(); draw();
})();

// ── NETWORK ──
const NET = {
  ws: null,
  myId: null,
  myNum: null,
  peers: {},
  channels: {},
  serverUrl: null,
  isHost: false,
  playerNames: {},
  allIds: [],

  connect(serverAddr, name) {
    return new Promise((resolve, reject) => {
      // ── Auto-detección ws:// vs wss:// ──────────────────────
      // Si el usuario ya puso el protocolo, lo respetamos
      let url;
      if (serverAddr.startsWith('ws://') || serverAddr.startsWith('wss://')) {
        url = serverAddr;
      } else {
        // IP local → ws://, dominio público → wss://
        const isLocal = /^(localhost|127\.|192\.168\.|10\.|172\.(1[6-9]|2[0-9]|3[01])\.|\d+\.\d+\.\d+\.\d+:\d+$)/.test(serverAddr);
        const proto = isLocal ? 'ws' : 'wss';
        url = `${proto}://${serverAddr}`;
      }

      UI.updateStatus(`Conectando a ${url}...`, null, null, null);
      NET.ws = new WebSocket(url);
      NET.ws.onopen = () => {
        NET.ws.send(JSON.stringify({ type: 'set_name', name }));
        resolve();
      };
      NET.ws.onerror = () => reject(new Error(`No se pudo conectar a ${url}`));
      NET.ws.onmessage = (e) => NET._onSignal(JSON.parse(e.data));
      NET.ws.onclose = () => { if(GAME.running) GAME.endGame('Conexión perdida'); };
    });
  },

  _onSignal(msg) {
    switch(msg.type) {
      case 'welcome':
        NET.myId = msg.id;
        NET.myNum = msg.playerNum;
        NET.isHost = (msg.playerNum === 1);
        UI.updateStatus('Conectado ✓', msg.totalPlayers + ' / 3', NET.isHost ? 'HOST' : 'Cliente', '—');
        UI.updateSlot(msg.playerNum, MY_NAME, true);
        break;

      case 'player_joined':
        UI.updateStatus(null, msg.totalPlayers + ' / 3', null, null);
        break;

      case 'start_signaling':
        NET.allIds = msg.players.sort((a,b)=>a.playerNum-b.playerNum).map(p=>p.id);
        UI.updateStatus('Conectado ✓', '3 / 3 ✓', null, 'Iniciando P2P...');
        msg.players.forEach(p => {
          if(p.id !== NET.myId) NET._createPeer(p.id, p.playerNum, NET.isHost || (NET.myNum < p.playerNum));
        });
        break;

      case 'offer':
        NET._handleOffer(msg);
        break;
      case 'answer':
        NET._handleAnswer(msg);
        break;
      case 'ice_candidate':
        NET._handleIce(msg);
        break;

      case 'player_left':
        if(GAME.running) GAME.endGame('Un jugador se desconectó');
        break;

      case 'error':
        UI.setError(msg.message);
        break;
    }
  },

  _rtcConfig() {
    return {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'stun:stun.cloudflare.com:3478' }
      ]
    };
  },

  _createPeer(remoteId, remoteNum, initiator) {
    const pc = new RTCPeerConnection(NET._rtcConfig());
    NET.peers[remoteId] = pc;

    pc.onicecandidate = (e) => {
      if(e.candidate) {
        NET.ws.send(JSON.stringify({ type:'ice_candidate', to:remoteId, candidate:e.candidate }));
      }
    };

    pc.onconnectionstatechange = () => {
      NET._checkAllConnected();
    };

    if(initiator) {
      const dc = pc.createDataChannel('game', { ordered: false, maxRetransmits: 0 });
      NET.channels[remoteId] = dc;
      NET._setupChannel(dc, remoteId);

      pc.createOffer().then(offer => {
        pc.setLocalDescription(offer);
        NET.ws.send(JSON.stringify({ type:'offer', to:remoteId, sdp:offer }));
      });
    } else {
      pc.ondatachannel = (e) => {
        NET.channels[remoteId] = e.channel;
        NET._setupChannel(e.channel, remoteId);
      };
    }
  },

  _setupChannel(dc, remoteId) {
    dc.onopen = () => NET._checkAllConnected();
    dc.onclose = () => { if(GAME.running) GAME.endGame('P2P desconectado'); };
    dc.onmessage = (e) => GAME.onNetMsg(JSON.parse(e.data), remoteId);
  },

  async _handleOffer(msg) {
    if(!NET.peers[msg.from]) NET._createPeer(msg.from, null, false);
    const pc = NET.peers[msg.from];
    await pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    NET.ws.send(JSON.stringify({ type:'answer', to:msg.from, sdp:answer }));
  },

  async _handleAnswer(msg) {
    const pc = NET.peers[msg.from];
    if(pc) await pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
  },

  async _handleIce(msg) {
    const pc = NET.peers[msg.from];
    if(pc) try { await pc.addIceCandidate(new RTCIceCandidate(msg.candidate)); } catch {}
  },

  _checkAllConnected() {
    const needed = NET.allIds.filter(id => id !== NET.myId);
    const ready = needed.every(id => NET.channels[id] && NET.channels[id].readyState === 'open');
    if(ready && needed.length > 0) {
      UI.updateStatus(null, null, null, 'P2P OK ✓');
      if(NET.isHost) GAME.start();
    }
  },

  broadcast(data) {
    const msg = JSON.stringify(data);
    Object.values(NET.channels).forEach(dc => {
      if(dc.readyState === 'open') try { dc.send(msg); } catch {}
    });
  },

  sendTo(id, data) {
    const dc = NET.channels[id];
    if(dc && dc.readyState === 'open') try { dc.send(JSON.stringify(data)); } catch {}
  }
};

// ── UI HELPERS ──
const UI = {
  updateStatus(conn, players, role, p2p) {
    if(conn !== null) {
      const el = document.getElementById('st-conn');
      el.textContent = conn;
      el.className = 'val ' + (conn.includes('✓')||conn==='Conectado' ? 'ok' : conn.includes('Conectando') ? 'warn' : 'ok');
    }
    if(players !== null) document.getElementById('st-players').textContent = players;
    if(role !== null) document.getElementById('st-role').textContent = role;
    if(p2p !== null) {
      const el = document.getElementById('st-p2p');
      el.textContent = p2p;
      el.className = 'val ' + (p2p.includes('OK') ? 'ok' : 'warn');
    }
  },
  updateSlot(num, name, filled) {
    const slot = document.getElementById('slot-' + num);
    if(!slot) return;
    slot.querySelector('.name').textContent = name || 'Esperando...';
    if(filled) slot.classList.add('filled');
    else slot.classList.remove('filled');
  },
  setError(msg) {
    const el = document.getElementById('st-conn');
    el.textContent = '⚠ ' + msg;
    el.className = 'val err';
  },
  showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('screen-' + id).classList.add('active');
  },
  showOverlay(title, score, msg) {
    document.getElementById('overlay-title').textContent = title;
    document.getElementById('overlay-score').textContent = score;
    document.getElementById('overlay-msg').textContent = msg;
    document.getElementById('overlay').classList.add('active');
  },
  hideOverlay() { document.getElementById('overlay').classList.remove('active'); }
};

// ── PLAYER COLORS ──
const PCOLORS = ['#00ffff','#ff00ff','#ffff00'];
const PGLOW   = ['#0ff','#f0f','#ff0'];

// ── GAME ENGINE ──
const GAME = {
  canvas: null,
  ctx: null,
  running: false,
  wave: 1,

  invaders: [],
  invaderDir: 1,
  invaderSpeed: 1,
  invaderDropTimer: 0,
  bullets: [],
  invaderBullets: [],
  shields: [],
  scores: [0, 0, 0],
  lives: [3, 3, 3],

  myShip: { x: 0, y: 0, w: 32, h: 20 },
  remotePlayers: {},
  bulletIdCounter: 0,

  lastTime: 0,
  stateTimer: 0,
  fireTimer: 0,
  invaderFireTimer: 0,

  keys: { left: false, right: false, fire: false },

  init() {
    GAME.canvas = document.getElementById('canvas');
    GAME.ctx = GAME.canvas.getContext('2d');
    GAME.resize();
    window.addEventListener('resize', GAME.resize);
    GAME.setupControls();
  },

  resize() {
    GAME.canvas.width = GAME.canvas.offsetWidth;
    GAME.canvas.height = GAME.canvas.offsetHeight;
    if(GAME.running) GAME.repositionShip();
  },

  W() { return GAME.canvas.width; },
  H() { return GAME.canvas.height; },

  repositionShip() {
    const num = NET.myNum;
    const positions = [0.25, 0.5, 0.75];
    GAME.myShip.x = GAME.W() * positions[num-1];
    GAME.myShip.y = GAME.H() - 40;
  },

  start() {
    GAME.running = true;
    GAME.scores = [0, 0, 0];
    GAME.lives = [3, 3, 3];
    GAME.wave = 1;
    GAME.bullets = [];
    GAME.invaderBullets = [];
    GAME.repositionShip();
    GAME.buildWave(1);

    NET.broadcast({ type: 'game_start', wave: 1 });

    UI.showScreen('game');
    GAME.lastTime = performance.now();
    requestAnimationFrame(GAME.loop);
  },

  buildWave(wave) {
    GAME.invaders = [];
    GAME.shields = [];
    const cols = 10, rows = Math.min(3 + Math.floor(wave/2), 6);
    const W = GAME.W();
    const spacingX = Math.min(44, (W - 60) / cols);
    const startX = (W - spacingX * (cols-1)) / 2;

    for(let r=0; r<rows; r++) {
      for(let c=0; c<cols; c++) {
        GAME.invaders.push({
          x: startX + c * spacingX,
          y: 60 + r * 32,
          type: r < 1 ? 2 : r < 3 ? 1 : 0,
          alive: true,
          animFrame: 0,
          id: r * 100 + c
        });
      }
    }

    const shieldPositions = [0.2, 0.5, 0.8];
    shieldPositions.forEach((px, i) => {
      GAME.shields.push({
        x: GAME.W() * px - 24,
        y: GAME.H() - 80,
        hp: 4,
        id: i
      });
    });

    GAME.invaderDir = 1;
    GAME.invaderSpeed = 0.4 + wave * 0.15;
    GAME.invaderFireTimer = 0;
  },

  loop(ts) {
    if(!GAME.running) return;
    const dt = Math.min((ts - GAME.lastTime) / 16.67, 3);
    GAME.lastTime = ts;

    GAME.update(dt);
    GAME.render();
    GAME.updateHUD();
    requestAnimationFrame(GAME.loop);
  },

  update(dt) {
    const W = GAME.W(), H = GAME.H();

    const speed = 3.5 * dt;
    if(GAME.keys.left)  GAME.myShip.x = Math.max(16, GAME.myShip.x - speed);
    if(GAME.keys.right) GAME.myShip.x = Math.min(W - 16, GAME.myShip.x + speed);

    GAME.fireTimer -= dt;
    if(GAME.keys.fire && GAME.fireTimer <= 0 && GAME.lives[NET.myNum-1] > 0) {
      GAME.fireTimer = 18;
      const bid = NET.myNum * 10000 + (GAME.bulletIdCounter++ % 9000);
      const bullet = { x: GAME.myShip.x, y: GAME.myShip.y - 14, vx: 0, vy: -6, owner: NET.myNum, id: bid };
      GAME.bullets.push(bullet);
      NET.broadcast({ type:'bullet', bullet });
    }

    NET.broadcast({ type:'pos', x: GAME.myShip.x, y: GAME.myShip.y, num: NET.myNum });

    GAME.bullets = GAME.bullets.filter(b => {
      b.x += b.vx * dt; b.y += b.vy * dt;
      return b.y > -10 && b.y < H + 10;
    });

    if(NET.isHost) {
      GAME.stateTimer -= dt;

      let hitEdge = false;
      const alive = GAME.invaders.filter(inv => inv.alive);
      alive.forEach(inv => { inv.x += GAME.invaderSpeed * GAME.invaderDir * dt; });
      alive.forEach(inv => {
        if(inv.x > W - 20 || inv.x < 20) hitEdge = true;
      });
      if(hitEdge) {
        GAME.invaderDir *= -1;
        alive.forEach(inv => { inv.y += 10; });
      }

      GAME.invaderDropTimer += dt;
      if(GAME.invaderDropTimer > 40) {
        GAME.invaderDropTimer = 0;
        alive.forEach(inv => inv.animFrame ^= 1);
      }

      GAME.invaderFireTimer -= dt;
      if(GAME.invaderFireTimer <= 0 && alive.length > 0) {
        GAME.invaderFireTimer = Math.max(30, 90 - GAME.wave * 5);
        const shooter = alive[Math.floor(Math.random() * alive.length)];
        const b = { x: shooter.x, y: shooter.y + 10, vx: (Math.random()-.5)*2, vy: 3, id: 90000 + (GAME.bulletIdCounter++ % 9000) };
        GAME.invaderBullets.push(b);
      }

      GAME.invaderBullets = GAME.invaderBullets.filter(b => {
        b.x += b.vx * dt; b.y += b.vy * dt;
        return b.y < H + 20;
      });

      GAME.bullets.forEach(bull => {
        GAME.invaders.forEach(inv => {
          if(!inv.alive) return;
          if(Math.abs(bull.x - inv.x) < 14 && Math.abs(bull.y - inv.y) < 10) {
            inv.alive = false;
            bull.y = -999;
            const pts = [10, 20, 30][inv.type];
            GAME.scores[bull.owner - 1] += pts;
          }
        });
      });

      GAME.bullets.forEach(bull => {
        GAME.shields.forEach(sh => {
          if(sh.hp <= 0) return;
          if(bull.x > sh.x && bull.x < sh.x+48 && bull.y > sh.y && bull.y < sh.y+18) {
            sh.hp--;
            bull.y = -999;
          }
        });
      });

      GAME.invaderBullets.forEach(bull => {
        GAME.shields.forEach(sh => {
          if(sh.hp <= 0) return;
          if(bull.x > sh.x && bull.x < sh.x+48 && bull.y > sh.y && bull.y < sh.y+18) {
            sh.hp--;
            bull.y = -999;
          }
        });
      });

      const allShips = [
        { x: GAME.myShip.x, y: GAME.myShip.y, num: NET.myNum },
        ...Object.values(GAME.remotePlayers)
      ];
      GAME.invaderBullets.forEach(bull => {
        allShips.forEach(ship => {
          if(Math.abs(bull.x - ship.x) < 14 && Math.abs(bull.y - ship.y) < 12) {
            const idx = ship.num - 1;
            if(GAME.lives[idx] > 0) {
              GAME.lives[idx]--;
              bull.y = H + 100;
            }
          }
        });
      });

      const reachedBottom = alive.some(inv => inv.y > H - 90);
      if(reachedBottom) GAME.lives = [0, 0, 0];

      if(alive.length === 0) {
        GAME.wave++;
        GAME.buildWave(GAME.wave);
        NET.broadcast({ type:'wave', wave: GAME.wave });
      }

      if(GAME.stateTimer <= 0) {
        GAME.stateTimer = 3;
        NET.broadcast({
          type: 'state',
          invaders: GAME.invaders.map(i => ({ id:i.id, alive:i.alive, x:i.x, y:i.y, animFrame:i.animFrame })),
          invaderBullets: GAME.invaderBullets,
          shields: GAME.shields.map(s => ({ id:s.id, hp:s.hp })),
          scores: GAME.scores,
          lives: GAME.lives,
          wave: GAME.wave
        });
      }

      if(GAME.lives.every(l => l <= 0)) {
        GAME.endGame('GAME OVER');
        NET.broadcast({ type:'gameover', scores: GAME.scores });
        return;
      }
    }
  },

  onNetMsg(msg, fromId) {
    switch(msg.type) {
      case 'game_start':
        if(!NET.isHost) {
          GAME.running = true;
          GAME.scores = [0,0,0];
          GAME.lives = [3,3,3];
          GAME.wave = msg.wave;
          GAME.bullets = [];
          GAME.invaderBullets = [];
          GAME.repositionShip();
          GAME.buildWave(msg.wave);
          UI.showScreen('game');
          GAME.lastTime = performance.now();
          requestAnimationFrame(GAME.loop);
        }
        break;

      case 'pos':
        if(!GAME.remotePlayers[fromId]) GAME.remotePlayers[fromId] = {};
        GAME.remotePlayers[fromId].x = msg.x;
        GAME.remotePlayers[fromId].y = msg.y;
        GAME.remotePlayers[fromId].num = msg.num;
        break;

      case 'bullet':
        if(!GAME.bullets.find(b => b.id === msg.bullet.id)) {
          GAME.bullets.push(msg.bullet);
        }
        break;

      case 'state':
        if(NET.isHost) break;
        msg.invaders.forEach(data => {
          const inv = GAME.invaders.find(i => i.id === data.id);
          if(inv) { inv.alive = data.alive; inv.x = data.x; inv.y = data.y; inv.animFrame = data.animFrame; }
        });
        GAME.invaderBullets = msg.invaderBullets;
        msg.shields.forEach(data => {
          const sh = GAME.shields.find(s => s.id === data.id);
          if(sh) sh.hp = data.hp;
        });
        GAME.scores = msg.scores;
        GAME.lives = msg.lives;
        GAME.wave = msg.wave;
        break;

      case 'wave':
        GAME.wave = msg.wave;
        if(!NET.isHost) GAME.buildWave(msg.wave);
        break;

      case 'gameover':
        GAME.scores = msg.scores;
        GAME.endGame('GAME OVER');
        break;
    }
  },

  endGame(reason) {
    GAME.running = false;
    const myScore = GAME.scores[NET.myNum-1];
    const maxScore = Math.max(...GAME.scores);
    const winner = GAME.scores.indexOf(maxScore) + 1;
    UI.showOverlay(reason, myScore, `Ganador: J${winner} con ${maxScore} pts\nTu puntuación: ${myScore}`);
  },

  render() {
    const ctx = GAME.ctx;
    const W = GAME.W(), H = GAME.H();
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#000008';
    ctx.fillRect(0, 0, W, H);

    GAME.shields.forEach(sh => {
      if(sh.hp <= 0) return;
      const alpha = sh.hp / 4;
      ctx.fillStyle = `rgba(0,255,100,${alpha})`;
      ctx.shadowColor = '#0f8';
      ctx.shadowBlur = 6;
      ctx.fillRect(sh.x, sh.y, 48, 18);
      ctx.shadowBlur = 0;
    });

    GAME.invaders.forEach(inv => {
      if(!inv.alive) return;
      GAME.drawInvader(ctx, inv.x, inv.y, inv.type, inv.animFrame);
    });

    ctx.fillStyle = '#f84';
    GAME.invaderBullets.forEach(b => {
      ctx.shadowColor = '#f84'; ctx.shadowBlur = 6;
      ctx.fillRect(b.x-2, b.y-6, 3, 10);
      ctx.shadowBlur = 0;
    });

    GAME.bullets.forEach(b => {
      const color = PCOLORS[b.owner-1] || '#fff';
      ctx.fillStyle = color;
      ctx.shadowColor = PGLOW[b.owner-1] || '#fff';
      ctx.shadowBlur = 8;
      ctx.fillRect(b.x-2, b.y-8, 3, 12);
      ctx.shadowBlur = 0;
    });

    Object.values(GAME.remotePlayers).forEach(p => {
      if(GAME.lives[p.num-1] <= 0) return;
      GAME.drawShip(ctx, p.x, p.y, p.num);
    });

    if(GAME.lives[NET.myNum-1] > 0) {
      GAME.drawShip(ctx, GAME.myShip.x, GAME.myShip.y, NET.myNum);
    }
  },

  drawShip(ctx, x, y, num) {
    const color = PCOLORS[num-1];
    const glow  = PGLOW[num-1];
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = color;
    ctx.shadowColor = glow;
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.moveTo(0, -14); ctx.lineTo(10, 6); ctx.lineTo(5, 3);
    ctx.lineTo(0, 6);   ctx.lineTo(-5, 3); ctx.lineTo(-10, 6);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#fff8';
    ctx.beginPath(); ctx.ellipse(0, -4, 3, 4, 0, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = color;
    ctx.font = '8px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('J' + num, 0, 20);
    ctx.restore();
  },

  drawInvader(ctx, x, y, type, frame) {
    ctx.save();
    ctx.translate(x, y);
    const colors = ['#88f','#4f4','#f44'];
    ctx.fillStyle = colors[type];
    ctx.shadowColor = colors[type];
    ctx.shadowBlur = 4;

    if(type === 0) {
      ctx.fillRect(-8,-5,4,10); ctx.fillRect(-4,-7,8,3); ctx.fillRect(-4,4,8,3);
      ctx.fillRect(4,-5,4,10);
      if(frame){ ctx.fillRect(-10,-3,2,6); ctx.fillRect(8,-3,2,6); }
      else { ctx.fillRect(-12,-5,2,4); ctx.fillRect(10,-5,2,4); }
    } else if(type === 1) {
      ctx.fillRect(-7,-6,14,8); ctx.fillRect(-4,-8,8,2);
      ctx.fillRect(-9,-2,2,6); ctx.fillRect(7,-2,2,6);
      if(frame){ ctx.fillRect(-5,2,4,4); ctx.fillRect(1,2,4,4); }
      else { ctx.fillRect(-4,2,3,5); ctx.fillRect(1,2,3,5); }
    } else {
      ctx.beginPath(); ctx.ellipse(0,-2,10,5,0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(0,-4,5,3,0,0,Math.PI*2); ctx.fill();
      if(frame){ ctx.fillRect(-8,2,4,3); ctx.fillRect(4,2,4,3); }
      else { ctx.fillRect(-6,2,3,4); ctx.fillRect(3,2,3,4); }
    }
    ctx.shadowBlur = 0;
    ctx.restore();
  },

  updateHUD() {
    let scHTML = '';
    const colors = ['#0ff','#f0f','#ff0'];
    GAME.scores.forEach((s, i) => {
      scHTML += `<span style="color:${colors[i]};margin-right:8px">J${i+1}:<b>${s}</b></span>`;
    });
    document.getElementById('hud-scores').innerHTML = scHTML;
    document.getElementById('hud-wave').textContent = `OLEADA ${GAME.wave}`;
    const myLives = GAME.lives[NET.myNum-1];
    let livesHTML = '';
    for(let i=0;i<3;i++) livesHTML += `<span style="color:${PCOLORS[NET.myNum-1]};opacity:${i<myLives?1:.2};font-size:.9rem">▲</span>`;
    document.getElementById('hud-lives').innerHTML = livesHTML;
  },

  setupControls() {
    function press(key, val) { GAME.keys[key] = val; }

    const btnL = document.getElementById('btn-left');
    const btnR = document.getElementById('btn-right');
    const btnF = document.getElementById('btn-fire');

    ['touchstart','mousedown'].forEach(ev => {
      btnL.addEventListener(ev, e=>{e.preventDefault(); press('left',true); btnL.classList.add('pressed');}, {passive:false});
      btnR.addEventListener(ev, e=>{e.preventDefault(); press('right',true); btnR.classList.add('pressed');}, {passive:false});
      btnF.addEventListener(ev, e=>{e.preventDefault(); press('fire',true); btnF.classList.add('pressed');}, {passive:false});
    });
    ['touchend','touchcancel','mouseup'].forEach(ev => {
      btnL.addEventListener(ev, e=>{e.preventDefault(); press('left',false); btnL.classList.remove('pressed');}, {passive:false});
      btnR.addEventListener(ev, e=>{e.preventDefault(); press('right',false); btnR.classList.remove('pressed');}, {passive:false});
      btnF.addEventListener(ev, e=>{e.preventDefault(); press('fire',false); btnF.classList.remove('pressed');}, {passive:false});
    });

    window.addEventListener('keydown', e => {
      if(e.key==='ArrowLeft'||e.key==='a') press('left',true);
      if(e.key==='ArrowRight'||e.key==='d') press('right',true);
      if(e.key===' ') press('fire',true);
    });
    window.addEventListener('keyup', e => {
      if(e.key==='ArrowLeft'||e.key==='a') press('left',false);
      if(e.key==='ArrowRight'||e.key==='d') press('right',false);
      if(e.key===' ') press('fire',false);
    });
  }
};

// ── LOBBY ──
let MY_NAME = 'Piloto';

document.getElementById('btn-connect').addEventListener('click', async () => {
  const serverAddr = document.getElementById('input-server').value.trim();
  MY_NAME = document.getElementById('input-name').value.trim() || 'Piloto';

  if(!serverAddr) {
    UI.setError('Introduce la dirección del servidor');
    return;
  }

  const btn = document.getElementById('btn-connect');
  btn.disabled = true;
  btn.textContent = 'CONECTANDO...';

  try {
    await NET.connect(serverAddr, MY_NAME);
    btn.textContent = 'ESPERANDO JUGADORES...';
  } catch(e) {
    btn.disabled = false;
    btn.textContent = 'CONECTAR';
    UI.setError(e.message);
  }
});

document.getElementById('btn-restart').addEventListener('click', () => {
  location.reload();
});

GAME.init();
</script>
